<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAR GO v0.5</title>
<meta name="theme-color" content="#080d19">
<style>
body{margin:0;background:#080d19;color:#eef3ff;font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#121b2e;border:1px solid #293753;border-radius:18px;padding:18px;margin:12px 0}
h1,h2{margin:0 0 8px}.muted{color:#9eabc4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,button{width:100%;box-sizing:border-box;padding:11px;margin-top:7px;border-radius:10px;border:1px solid #35445f;background:#0c1424;color:#fff}
button{background:#91aaff;color:#08101e;font-weight:800;border:0}.secondary{background:#263653;color:#fff}
.score{font-size:64px;font-weight:900}.badge{display:inline-block;background:#263653;border-radius:999px;padding:7px 12px}
.metric{background:#0c1424;border-radius:12px;padding:12px}.num{font-size:26px;font-weight:800}.row{display:flex;justify-content:space-between;margin:9px 0}
.bar{height:9px;background:#28344d;border-radius:8px;overflow:hidden}.fill{height:100%;background:#91aaff}
.chart{height:210px;display:flex;align-items:flex-end;gap:3px}.col{flex:1;background:#91aaff;min-width:4px;position:relative;border-radius:4px 4px 0 0}.col span{position:absolute;bottom:-18px;font-size:9px}
.small{font-size:13px}.ok{color:#b8ffc8}.warn{color:#ffe09b}.err{color:#ff9f9f}
</style>
</head>
<body><div class="wrap">
<h1>📷 STAR GO <span class="muted">v0.5</span></h1>
<p class="muted">まず「現在地」と「天気API」が確実に動くことを優先した安定版</p>

<div class="card"><h2>📍 撮影地点</h2>
<div class="grid">
<div>緯度<input id="lat" value="35.4437"></div>
<div>経度<input id="lon" value="139.6380"></div>
<div>日付<input id="date" type="date"></div>
<div>地点名<input id="place" value="臨港パーク"></div>
</div>
<button id="loc">📍 現在地を取得</button>
<button id="load" class="secondary">☁️ 予報を取得</button>
<p id="status" class="small muted">HTTPS上で開いている場合、現在地を取得できます。</p>
</div>

<div class="card"><h2>🔧 接続診断</h2>
<div class="grid">
<div class="metric">GPS<div id="gps" class="num">--</div></div>
<div class="metric">天気API<div id="api" class="num">--</div></div>
</div>
<p id="diag" class="small muted">ここにエラー内容も表示します。</p>
</div>

<div class="card"><div class="muted">🔥 今日ここへ行くべき度</div>
<div id="total" class="score">--</div><div id="verdict" class="badge">---</div>
<p id="summary" class="muted">---</p></div>

<div class="card"><h2>🌌 星空</h2><div class="grid">
<div class="metric">星空指数<div id="star" class="num">--</div></div>
<div class="metric">天の川期待度<div id="milky" class="num">--</div></div>
</div>
<div class="row">低層雲 <b id="lowT">--</b></div><div class="bar"><div id="lowB" class="fill"></div></div>
<div class="row">中層雲 <b id="midT">--</b></div><div class="bar"><div id="midB" class="fill"></div></div>
<div class="row">高層雲 <b id="highT">--</b></div><div class="bar"><div id="highB" class="fill"></div></div>
<div class="row">視程 <b id="visT">--</b></div>
<div class="row">湿度 <b id="humT">--</b></div>
</div>

<div class="card"><h2>🌙 月・天文条件</h2><div class="grid">
<div class="metric">月齢<div id="age" class="num">--</div></div>
<div class="metric">月明かり<div id="illum" class="num">--</div></div>
</div></div>

<div class="card"><h2>🌇🌅 焼け</h2><div class="grid">
<div class="metric">夕焼け指数<div id="sunset" class="num">--</div></div>
<div class="metric">朝焼け指数<div id="sunrise" class="num">--</div></div>
</div></div>

<div class="card"><h2>🎯 今日の狙い目</h2><div id="best" class="metric">予報を取得してください</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(100,x));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

const d0=new Date();
$("date").value=new Date(d0-d0.getTimezoneOffset()*60000).toISOString().slice(0,10);

function status(t,kind="muted"){
 $("status").className="small "+kind;
 $("status").textContent=t;
}
function moon(date){
 const ref=Date.UTC(2000,0,6,18,14),d=new Date(date+"T12:00:00").getTime();
 let age=((d-ref)/86400000)%29.530588853;if(age<0)age+=29.530588853;
 return {age,illum:(1-Math.cos(2*Math.PI*age/29.530588853))/2};
}

$("loc").onclick=()=>{
 $("gps").textContent="取得中";
 if(!window.isSecureContext){
   $("gps").textContent="NG";
   $("diag").textContent="このページがHTTPSではありません。GitHub Pagesのhttps:// URLから開いてください。";
   status("HTTPSではないため位置情報を利用できません。","warn"); return;
 }
 if(!navigator.geolocation){
   $("gps").textContent="NG";$("diag").textContent="このブラウザはGeolocation APIに対応していません。";
   status("位置情報に対応していません。","warn");return;
 }
 status("📍 GPSを取得しています…");
 navigator.geolocation.getCurrentPosition(
   pos=>{
     $("lat").value=pos.coords.latitude.toFixed(5);
     $("lon").value=pos.coords.longitude.toFixed(5);
     $("place").value="現在地";
     $("gps").textContent="OK";
     $("diag").textContent="GPS取得成功。緯度・経度を入力しました。";
     status("📍 現在地を取得しました。","ok");
     getWeather();
   },
   err=>{
     $("gps").textContent="NG";
     const m={1:"位置情報の利用が拒否されました。サイト設定で許可してください。",2:"位置情報を取得できませんでした。",3:"GPS取得がタイムアウトしました。"};
     $("diag").textContent=m[err.code]||("GPS error code: "+err.code);
     status(m[err.code]||"GPS取得に失敗しました。","warn");
   },
   {enableHighAccuracy:true,timeout:15000,maximumAge:300000}
 );
};

$("load").onclick=getWeather;

async function getWeather(){
 const lat=Number($("lat").value),lon=Number($("lon").value),date=$("date").value;
 if(!Number.isFinite(lat)||!Number.isFinite(lon)){status("緯度・経度が正しくありません。","warn");return;}
 $("api").textContent="取得中";
 $("diag").textContent="Open-Meteoへ接続しています…";
 status("☁️ 天気予報を取得しています…");
 try{
   /* v0.5はAPIを分離。まずforecast APIで確実に取得する */
   const url="https://api.open-meteo.com/v1/forecast"+
     "?latitude="+encodeURIComponent(lat)+
     "&longitude="+encodeURIComponent(lon)+
     "&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,relative_humidity_2m,visibility"+
     "&timezone=auto"+
     "&start_date="+encodeURIComponent(date)+
     "&end_date="+encodeURIComponent(date);
   const res=await fetch(url,{method:"GET",mode:"cors",cache:"no-store"});
   const text=await res.text();
   if(!res.ok)throw new Error("HTTP "+res.status+" "+text.slice(0,160));
   let json;try{json=JSON.parse(text)}catch(e){throw new Error("JSONを解釈できません: "+text.slice(0,120))}
   if(!json.hourly||!json.hourly.time)throw new Error("hourlyデータがありません");
   window.weather=json;
   $("api").textContent="OK";
   $("diag").textContent="天気API取得成功。"+json.hourly.time.length+"時間分のデータを受信しました。";
   status("☁️ 予報を取得しました。","ok");
   calc();
 }catch(e){
   $("api").textContent="NG";
   $("diag").textContent="APIエラー: "+e.message;
   status("予報取得に失敗しました。診断欄を確認してください。","err");
 }
}

function calc(){
 const w=window.weather;if(!w)return;
 const m=moon($("date").value);
 $("age").textContent=m.age.toFixed(1);
 $("illum").textContent=Math.round(m.illum*100)+"%";

 const scores=w.hourly.time.map((_,i)=>{
   const c=w.hourly.cloud_cover[i]??100,lo=w.hourly.cloud_cover_low[i]??c;
   const md=w.hourly.cloud_cover_mid[i]??c,hi=w.hourly.cloud_cover_high[i]??c;
   const hum=w.hourly.relative_humidity_2m[i]??100;
   const vis=(w.hourly.visibility[i]??0)/1000;
   const clear=100-(.55*c+.25*lo+.12*md+.08*hi);
   const visibility=clamp(vis/25*100);
   const humidity=clamp(100-Math.max(0,hum-50)*1.8);
   const star=clamp(.38*clear+.24*(100-m.illum*55)+.20*visibility+.18*humidity);
   const burn=clamp(.45*(100-Math.abs(c-35)*2.2)+.25*visibility+.30*(100-Math.abs(hum-65)*1.8));
   return {star,burn};
 });
 const night=scores.filter((x,i)=>{const h=+w.hourly.time[i].slice(11,13);return h>=18||h<=5});
 const star=avg(night.map(x=>x.star));
 const milky=clamp(star*(1-m.illum)*1.15);
 const burn=avg(scores.map(x=>x.burn));

 $("star").textContent=Math.round(star);
 $("milky").textContent=Math.round(milky);
 $("sunset").textContent=Math.round(burn);
 $("sunrise").textContent=Math.round(burn);

 let i0=w.hourly.time.findIndex(t=>t.slice(11,13)==="22");if(i0<0)i0=0;
 const lo=avg(w.hourly.cloud_cover_low.slice(i0,i0+6));
 const md=avg(w.hourly.cloud_cover_mid.slice(i0,i0+6));
 const hi=avg(w.hourly.cloud_cover_high.slice(i0,i0+6));
 $("lowT").textContent=Math.round(lo)+"%";$("midT").textContent=Math.round(md)+"%";$("highT").textContent=Math.round(hi)+"%";
 $("lowB").style.width=lo+"%";$("midB").style.width=md+"%";$("highB").style.width=hi+"%";
 $("visT").textContent=Math.round(avg(w.hourly.visibility.slice(i0,i0+6))/1000)+" km";
 $("humT").textContent=Math.round(avg(w.hourly.relative_humidity_2m.slice(i0,i0+6)))+"%";

 const total=.65*star+.35*burn;
 $("total").textContent=Math.round(total);
 $("verdict").textContent=total>=85?"🔥 出撃推奨":total>=70?"👍 行く価値あり":total>=50?"🤔 条件次第":"🛑 見送り寄り";
 $("summary").textContent=total>=85?"かなり狙い目。":total>=70?"十分チャンスあり。":total>=50?"時間を絞れば狙えそう。":"今回は条件弱め。";

 let bi=-1,bv=-1;
 scores.forEach((x,i)=>{const h=+w.hourly.time[i].slice(11,13);if((h>=18||h<=5)&&x.star>bv){bv=x.star;bi=i}});
 if(bi>=0)$("best").innerHTML="<b>"+w.hourly.time[bi].slice(11,16)+"</b>　🌌 星空 "+Math.round(scores[bi].star)+"/100";
}

getWeather();
</script>
</body></html>
